<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка анкеты...</title>
    <style>
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; background-color: #f4f4f7; 
        }
        .container { text-align: center; padding: 20px; max-width: 90%; }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn { 
            background-color: #ffc107; 
            color: #000; 
            padding: 16px 24px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 12px; 
            display: inline-block;
            font-size: 18px;
            margin-top: 20px;
        }
        .hint { color: #888; margin-top: 20px; font-size: 13px; line-height: 1.5; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffc107;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="loader"></div>
        <div style="font-weight: bold; font-size: 19px;">Открываем анкету</div>
        
        <!-- Ссылка через Google Redirect (для iOS и ПК) -->
        <a href="https://www.google.com/url?q=https://reg.eda.yandex.ru/?advertisement_campaign%3Dforms_for_agents%26user_invite_code%3D401b2c1d47c8415097663a351d400a42%26utm_content%3Dblank" 
           id="mainButton" class="btn">
            ПРОДОЛЖИТЬ
        </a>

        <div class="hint">
            Если анкета не открылась автоматически, нажмите на кнопку.<br>
            <span id="vk-hint" style="display:none;">Для корректной работы в ВК: нажмите ⋮ в углу и выберите «Открыть в браузере».</span>
        </div>
    </div>
</div>

<script>
    const rawUrl = "reg.eda.yandex.ru/?advertisement_campaign=forms_for_agents&user_invite_code=401b2c1d47c8415097663a351d400a42&utm_content=blank";
    const googleUrl = "https://www.google.com/url?q=https://" + rawUrl.replace(/&/g, "%26").replace(/=/g, "%3D");
    const androidIntent = "intent://" + rawUrl + "#Intent;scheme=https;package=com.android.chrome;end";

    function doRedirect() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isAndroid = /Android/i.test(ua);
        const isVK = (ua.indexOf("VKMobile") > -1 || ua.indexOf("VK_i18n") > -1);

        if (isVK) {
            document.getElementById('vk-hint').style.display = 'block';
        }

        if (isAndroid) {
            // Принудительно выкидываем Android из ВК/приложений в Chrome
            window.location.href = androidIntent;
        } else {
            // Для iOS используем Google Redirect через небольшую паузу
            setTimeout(() => {
                window.location.href = googleUrl;
            }, 1500);
        }
    }

    // Запускаем автоматический переход
    window.onload = doRedirect;
</script>

</body>
</html>
